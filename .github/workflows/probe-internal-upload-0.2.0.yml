name: Probe Internal 0.2.0 Upload

on:
  push:
    branches:
      - 'build/internal-0.2.0-from-beta-241'
    paths:
      - '.github/workflows/probe-internal-upload-0.2.0.yml'

permissions:
  contents: read

env:
  RELEASE_DEPLOY_HOST: 149.88.84.90
  RELEASE_DEPLOY_USER: adventure-release
  RELEASE_SSH_KEY: ${{ secrets.INTERNAL_RELEASE_SSH_KEY }}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe upload progress
        shell: bash
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$RELEASE_SSH_KEY" > "$HOME/.ssh/internal-release"
          chmod 0600 "$HOME/.ssh/internal-release"
          ssh-keyscan -T 15 -p 22 -H "$RELEASE_DEPLOY_HOST" > "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/internal-release" -o BatchMode=yes -o IdentitiesOnly=yes             "$RELEASE_DEPLOY_USER@$RELEASE_DEPLOY_HOST"             "df -h /srv/adventure-releases; echo '---'; ls -lh /srv/adventure-releases/internal/0.2.0 2>/dev/null || true"
