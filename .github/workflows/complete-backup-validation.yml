name: Core data validation

on:
  pull_request:
    paths:
      - 'lib/core/account/**'
      - 'lib/core/portability/**'
      - 'lib/core/storage/**'
      - 'lib/core/sync/**'
      - 'lib/features/focus/**'
      - 'lib/features/home/presentation/home_page.dart'
      - 'lib/features/orders/**'
      - 'lib/features/products/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/complete-backup-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
