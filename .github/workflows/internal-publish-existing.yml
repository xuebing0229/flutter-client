name: Publish Existing Internal 0.1.4

on:
  push:
    branches:
      - 'build/internal-0.1.4-from-beta-158'
    paths:
      - '.github/workflows/internal-publish-existing.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  SOURCE_RUN_ID: '38894726371'
  INTERNAL_SOURCE_BUILD: '158'
  INTERNAL_RELEASE_BUILD: '5'
  RELEASE_SITE_BASE_URL: https://license.apixb.top/releases
  RELEASE_DEPLOY_HOST: license.apixb.top
  RELEASE_DEPLOY_USER: adventure-release
  RELEASE_DEPLOY_PATH: /srv/adventure-releases
  RELEASE_SSH_KEY: ${{ secrets.INTERNAL_RELEASE_SSH_KEY }}

jobs:
  publish-existing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download existing Android artifact
        uses: actions/download-artifact@v4
        with:
          name: internal-android-package
          path: dist
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download existing Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: internal-windows-package
          path: dist
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release-site payload
        shell: bash
        run: |
          test -n "$RELEASE_SSH_KEY"
          VERSION=$(python3 - <<'PY'
          from pathlib import Path
          for line in Path("pubspec.yaml").read_text().splitlines():
              if line.startswith("version:"):
                  print(line.split(":", 1)[1].strip().split("+", 1)[0])
                  break
          PY
          )
          test "$VERSION" = "0.1.4"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          mkdir -p "site/internal/$VERSION"
          cp dist/app-internal.apk "site/internal/$VERSION/app-internal.apk"
          cp dist/app-windows-internal.zip "site/internal/$VERSION/app-windows-internal.zip"
          cp dist/app-windows-internal-setup.exe "site/internal/$VERSION/app-windows-internal-setup.exe"
          cp server/release_site/index.html site/index.html

          python3 - "$VERSION" "$INTERNAL_RELEASE_BUILD" "$INTERNAL_SOURCE_BUILD" "$RELEASE_SITE_BASE_URL" <<'PY'
          import hashlib
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          version, build, source_build, base_url = sys.argv[1:]
          build = int(build)
          source_build = int(source_build)
          root = Path("site")
          release_dir = root / "internal" / version
          android = release_dir / "app-internal.apk"
          windows_zip = release_dir / "app-windows-internal.zip"
          windows_setup = release_dir / "app-windows-internal-setup.exe"

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          published_at = datetime.now(timezone.utc).isoformat()
          release_base = f"{base_url}/internal/{version}"
          notes = (
              "Windows 卸载流程与新设备加入继续修复；"
              "内测版新增应用内检查更新、断点续传、暂停继续和自动安装，"
              "更新文件改由公会自己的香港服务器提供。"
          )

          android_data = {
              "schema": 1,
              "channel": "internal",
              "version": version,
              "build": build,
              "published": True,
              "download_url": f"{release_base}/app-internal.apk",
              "size_bytes": android.stat().st_size,
              "sha256": sha256(android),
              "notes": notes,
          }
          windows_data = {
              "schema": 1,
              "channel": "internal",
              "version": version,
              "build": build,
              "published": True,
              "download_url": f"{release_base}/app-windows-internal.zip",
              "size_bytes": windows_zip.stat().st_size,
              "sha256": sha256(windows_zip),
              "notes": notes,
          }
          latest = {
              "schema": 1,
              "channel": "internal",
              "version": version,
              "build": build,
              "source_test_build": source_build,
              "published": True,
              "published_at": published_at,
              "notes": notes,
              "android": {
                  "download_url": android_data["download_url"],
                  "size_bytes": android_data["size_bytes"],
                  "sha256": android_data["sha256"],
              },
              "windows": {
                  "download_url": windows_data["download_url"],
                  "size_bytes": windows_data["size_bytes"],
                  "sha256": windows_data["sha256"],
                  "installer_url": f"{release_base}/app-windows-internal-setup.exe",
                  "installer_size_bytes": windows_setup.stat().st_size,
                  "installer_sha256": sha256(windows_setup),
              },
          }

          (root / "internal" / "android-latest.json").write_text(
              json.dumps(android_data, ensure_ascii=False, indent=2) + "\n"
          )
          (root / "internal" / "windows-latest.json").write_text(
              json.dumps(windows_data, ensure_ascii=False, indent=2) + "\n"
          )
          (root / "internal" / "latest.json").write_text(
              json.dumps(latest, ensure_ascii=False, indent=2) + "\n"
          )
          (release_dir / "release.json").write_text(
              json.dumps(latest, ensure_ascii=False, indent=2) + "\n"
          )
          PY

      - name: Configure SSH
        shell: bash
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$RELEASE_SSH_KEY" > "$HOME/.ssh/internal-release"
          chmod 0600 "$HOME/.ssh/internal-release"
          ssh-keygen -y -f "$HOME/.ssh/internal-release" >/dev/null
          ssh-keyscan -H "$RELEASE_DEPLOY_HOST" > "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o PreferredAuthentications=publickey \
            -i "$HOME/.ssh/internal-release" \
            "$RELEASE_DEPLOY_USER@$RELEASE_DEPLOY_HOST" true

      - name: Upload versioned files and page first
        shell: bash
        run: |
          SSH="ssh -i $HOME/.ssh/internal-release -o BatchMode=yes -o IdentitiesOnly=yes -o PreferredAuthentications=publickey"
          $SSH "$RELEASE_DEPLOY_USER@$RELEASE_DEPLOY_HOST" \
            "mkdir -p '$RELEASE_DEPLOY_PATH/internal/$VERSION'"
          SCP="scp -i $HOME/.ssh/internal-release -o BatchMode=yes -o IdentitiesOnly=yes -o PreferredAuthentications=publickey"
          $SCP -p site/internal/$VERSION/* \
            "$RELEASE_DEPLOY_USER@$RELEASE_DEPLOY_HOST:$RELEASE_DEPLOY_PATH/internal/$VERSION/"
          $SCP -p site/index.html \
            "$RELEASE_DEPLOY_USER@$RELEASE_DEPLOY_HOST:$RELEASE_DEPLOY_PATH/index.html"

      - name: Publish latest manifests last
        shell: bash
        run: |
          SSH="ssh -i $HOME/.ssh/internal-release -o BatchMode=yes -o IdentitiesOnly=yes -o PreferredAuthentications=publickey"
          SCP="scp -i $HOME/.ssh/internal-release -o BatchMode=yes -o IdentitiesOnly=yes -o PreferredAuthentications=publickey"
          $SCP -p \
            site/internal/android-latest.json \
            site/internal/windows-latest.json \
            site/internal/latest.json \
            "$RELEASE_DEPLOY_USER@$RELEASE_DEPLOY_HOST:$RELEASE_DEPLOY_PATH/internal/"

      - name: Verify published release site
        shell: bash
        run: |
          curl --fail --show-error --silent --retry 5 --retry-delay 2 \
            "$RELEASE_SITE_BASE_URL/" >/dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 2 \
            "$RELEASE_SITE_BASE_URL/internal/latest.json" | tee /tmp/latest.json
          curl --fail --show-error --silent --retry 5 --retry-delay 2 \
            "$RELEASE_SITE_BASE_URL/internal/android-latest.json" >/dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 2 \
            "$RELEASE_SITE_BASE_URL/internal/windows-latest.json" >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/latest.json").read_text())
          assert data["channel"] == "internal"
          assert data["version"] == "0.1.4"
          assert data["build"] == 5
          assert data["source_test_build"] == 158
          PY
