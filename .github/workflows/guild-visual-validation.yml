name: Guild Visual Validation

on:
  pull_request:
    paths:
      - 'lib/app/app.dart'
      - 'lib/core/theme/**'
      - 'lib/features/home/presentation/home_page.dart'
      - 'lib/features/home/presentation/app_drawer.dart'
      - 'lib/features/shared/presentation/**'
      - 'test/core/guild_visual_theme_test.dart'
      - '.github/workflows/guild-visual-validation.yml'
      - 'lib/core/update/windows_self_update_launcher.dart'
      - 'android/app/src/main/kotlin/com/workspace/client/k7m4/BackupFileBridge.kt'
      - 'lib/core/portability/**'
      - 'lib/core/sync/**'
      - 'lib/features/orders/data/order_reference_image_store.dart'
      - 'test/core/**'
      - 'test/features/order_reference_image_store_test.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-ui-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      # Two known unrelated update-installer warnings exist on main.
      # Surface warnings in logs, but only errors block this UI-only PR.
      - run: flutter analyze --no-fatal-warnings
      - run: flutter test test/core/guild_visual_theme_test.dart


  audit-full-suite:
    if: github.head_ref == 'audit/sol-recheck-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Full Flutter test suite
        run: flutter test
      - name: Bundle PP-OCRv6 Small models
        run: python3 tool/fetch_official_ppocrv6_models.py
      - name: Compile Android Beta debug
        run: flutter build apk --debug --flavor beta --no-pub

  audit-windows:
    if: github.head_ref == 'audit/sol-recheck-20261011'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Enable Windows
        shell: pwsh
        run: flutter config --enable-windows-desktop
      - name: Install dependencies
        shell: pwsh
        run: flutter pub get
      - name: Test Windows updater and installer process shutdown
        shell: powershell
        run: ./tool/test_windows_updater.ps1
      - name: Compile Windows debug
        shell: pwsh
        run: flutter build windows --debug
      - name: Compile desktop pet host
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'audit-desktop-pet'
          dotnet publish 'windows/desktop_pet/AdventurersGuild.DesktopPet.csproj' `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o $output
          if (-not (Test-Path (Join-Path $output 'AdventurersGuild.DesktopPet.exe'))) {
            throw 'Desktop pet host was not created.'
          }
      - name: Parse embedded updater PowerShell
        shell: pwsh
        run: |
          $source = Get-Content -Raw 'lib/core/update/windows_self_update_launcher.dart'
          $match = [regex]::Match(
            $source,
            "(?s)const String _powerShellScript = r'''(.*?)''';"
          )
          if (-not $match.Success) {
            throw 'Embedded Windows updater PowerShell was not found.'
          }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput(
            $match.Groups[1].Value,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'Embedded Windows updater PowerShell has syntax errors.'
          }
