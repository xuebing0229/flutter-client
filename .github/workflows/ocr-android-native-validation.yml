name: Native Official PP-OCRv6 Verification (not a release)

on:
  push:
    branches:
      - fix/adventurer-news-inline-20261008
      - fix/ocr-directed-tag-20261009
      - fix/ocr-real-recovery-20261009
      - feat/dual-ocr-paddle-20261009
      - 'feat/ppocrv6-small-session-scope-20261009'
      - 'fix/ocr-native-crash-diagnostics-20261009'
      - 'fix/ppocrv6-official-baseline-20261009'
      - 'fix/ocr-clean-symbol-fragments-20261009'
    paths:
      - 'android/app/src/androidTest/**'
      - 'android/app/build.gradle.kts'
      - 'android/ppocr-sdk/**'
      - '.github/workflows/ocr-android-native-validation.yml'
      - 'lib/features/imports/**'
      - 'test/features/screenshot_*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-native-android-ocr
  cancel-in-progress: true

jobs:
  real-ppocrv6-ocr:
    name: Official PP-OCRv6 Android emulator integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Flutter dependencies
        run: flutter pub get
      # The repository intentionally does not commit the gradlew shell wrapper.
      # Use the exact pinned Gradle distribution instead of assuming it exists.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Generate local Flutter/Android paths for Gradle
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          cat android/local.properties
      - name: Bundle PP-OCRv6 Small models
        run: python3 tool/fetch_official_ppocrv6_models.py
      - name: Enable hardware acceleration for GitHub hosted runner
        run: |
          if test -e /dev/kvm; then
            sudo chmod a+rw /dev/kvm
            ls -l /dev/kvm
          else
            echo "WARNING: /dev/kvm is missing; software emulator will be slow."
          fi
      - name: Test official PP-OCRv6 SDK on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 8G
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 900
          # The fixtures are synthetic, but all their pixels go through the
          # real official PaddleOCR v6 SDK. Preserve the actual recognized
          # lines in CI logs for reviewing price/title omissions.
          script: bash -lc 'cd android; gradle :app:connectedBetaDebugAndroidTest --no-daemon --console=plain --stacktrace; status=$?; adb logcat -d -s AG_REAL_OCR:I "*:S" | tail -n 250; exit "$status"'
      - name: Upload instrumentation reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chinese-official-ppocrv6-real-pixel-tests
          path: |
            build/app/outputs/androidTest-results/connected/**
            build/app/reports/androidTests/connected/**
          if-no-files-found: ignore
          retention-days: 7

  dart-import-regressions:
    name: Screenshot field parsing and title/preset regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run screenshot import parser tests (not a release)
        run: |
          flutter test test/features/screenshot_mihuashi_detail_layout_test.dart test/features/screenshot_huajia_detail_layout_test.dart test/features/screenshot_title_reconciliation_test.dart test/features/screenshot_layout_parser_test.dart test/features/screenshot_ocr_real_world_regression_test.dart test/features/screenshot_real_layout_regression_test.dart test/features/import_batch_preset_state_test.dart test/features/screenshot_product_layout_parser_test.dart test/features/screenshot_product_dedup_test.dart
      - name: Analyze import sources
        run: flutter analyze lib/features/imports
