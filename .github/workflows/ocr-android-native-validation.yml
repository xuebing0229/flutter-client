name: Native Android Chinese OCR Verification (not a release)

on:
  push:
    branches:
      - fix/adventurer-news-inline-20261008
    paths:
      - 'android/app/src/androidTest/**'
      - 'android/app/build.gradle.kts'
      - '.github/workflows/ocr-android-native-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-native-android-ocr
  cancel-in-progress: true

jobs:
  real-mlkit-ocr:
    name: ML Kit Chinese OCR emulator integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Flutter dependencies
        run: flutter pub get
      - name: Enable hardware acceleration
        run: |
          sudo bash -c 'echo KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Run actual bundled Chinese ML Kit on emulated Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 8G
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            cd android
            chmod +x gradlew
            ./gradlew :app:connectedBetaDebugAndroidTest --no-daemon --console=plain --stacktrace
      - name: Upload instrumentation reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chinese-mlkit-real-pixel-tests
          path: |
            android/app/build/outputs/androidTest-results/connected/**
            android/app/build/reports/androidTests/connected/**
          if-no-files-found: ignore
          retention-days: 7
