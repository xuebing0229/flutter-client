name: PWA peer native validation

on:
  push:
    branches:
      - 'feat/pwa-from-beta-182'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-peer-native-validation
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Bundle PP-OCRv6 Small models
        run: python3 tool/fetch_official_ppocrv6_models.py
      - name: Compile Android beta debug
        run: flutter build apk --debug --flavor beta --no-pub

  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Enable Windows
        shell: pwsh
        run: flutter config --enable-windows-desktop
      - name: Install dependencies
        shell: pwsh
        run: flutter pub get
      - name: Compile Windows debug
        shell: pwsh
        run: flutter build windows --debug
