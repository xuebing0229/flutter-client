name: Export Internal 0.1.3 Direct Files

on:
  push:
    branches:
      - 'export/internal-0.1.3-files'
    paths:
      - '.github/workflows/internal-export-0.1.3.yml'

permissions:
  actions: read
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download completed Internal Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download 38882351084 \
            --repo "${GITHUB_REPOSITORY}" \
            --name internal-windows-package \
            --dir dist

      - name: Verify direct installer
        run: |
          test -f dist/app-windows-internal-setup.exe
          ls -lh dist/app-windows-internal-setup.exe

      - name: Download completed Internal Android artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38882351084 \
            --repo "${GITHUB_REPOSITORY}" \
            --name internal-android-package \
            --dir dist

      - name: Publish direct Internal files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete internal-v0.1.3-files --repo "${GITHUB_REPOSITORY}" --yes 2>/dev/null || true
          git push origin :refs/tags/internal-v0.1.3-files 2>/dev/null || true
          gh release create internal-v0.1.3-files \
            "dist/app-internal.apk#冒险者公会-内测版-0.1.3.apk" \
            "dist/app-windows-internal-setup.exe#冒险者公会-内测版-0.1.3-安装版.exe" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "冒险者公会 内测版 0.1.3" \
            --notes "Direct Android APK and Windows installer for Internal 0.1.3, promoted from Beta 156."
