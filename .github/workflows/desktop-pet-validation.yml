name: Desktop pet validation

on:
  push:
    branches:
      - feature/desktop-pet-vpet

permissions:
  contents: read

concurrency:
  group: desktop-pet-validation
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze

  windows-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows application
        shell: pwsh
        run: flutter build windows --debug
      - name: Publish desktop pet host
        shell: pwsh
        run: |
          dotnet publish "windows/desktop_pet/AdventurersGuild.DesktopPet.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o "$env:RUNNER_TEMP/desktop_pet"
          if (-not (Test-Path "$env:RUNNER_TEMP/desktop_pet/AdventurersGuild.DesktopPet.exe")) {
            throw "Desktop pet host was not created."
          }
