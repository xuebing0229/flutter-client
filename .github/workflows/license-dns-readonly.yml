name: License DNS Readonly Check

on:
  push:
    branches:
      - "deploy/license-worker-staging"
    paths:
      - ".github/workflows/license-dns-readonly.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect public production hostname
        shell: bash
        run: |
          set -euo pipefail
          echo "A records:"
          dig +short license.apixb.top A || true
          echo "AAAA records:"
          dig +short license.apixb.top AAAA || true
          echo "HTTPS headers:"
          curl -sS -D - -o /tmp/health-body --max-time 15 https://license.apixb.top/health | sed -n '1,30p'
          echo "Health body:"
          cat /tmp/health-body
