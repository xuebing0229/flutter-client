name: License DNS Readonly Check

on:
  push:
    branches:
      - "deploy/license-worker-staging"
    paths:
      - ".github/workflows/license-dns-readonly.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Inspect production hostname DNS
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          zone_json="$(curl -fsS             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/zones?name=apixb.top")"
          zone_id="$(printf '%s' "$zone_json" | jq -r '.result[0].id // empty')"
          test -n "$zone_id"
          dns_json="$(curl -fsS             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?name=license.apixb.top")"
          printf '%s' "$dns_json" | jq -c '
            {success,records:[.result[]|{id,type,name,content,proxied,ttl}]}
          '
