name: Temporary Windows Package Size Audit
# second commit triggers this temporary workflow

on:
  push:
    branches:
      - 'build/beta-242-ocr-card-retention'
    paths:
      - '.github/workflows/windows-package-size-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Download published Windows Beta 245 ZIP
        run: |
          curl -fL --retry 3             'https://github.com/xuebing0229/release-files/releases/download/beta-v0.0.1%2B245-run277/app-windows-beta.zip'             -o app-windows-beta.zip

      - name: Report ZIP composition
        run: |
          python3 - <<'PY'
          import collections
          import zipfile

          path = 'app-windows-beta.zip'
          with zipfile.ZipFile(path) as z:
              infos = [i for i in z.infolist() if not i.is_dir()]

          def mib(n):
              return n / 1024 / 1024

          groups = collections.defaultdict(lambda: [0, 0, 0])
          for i in infos:
              name = i.filename.replace('\\', '/')
              top = name.split('/', 1)[0] if '/' in name else '(root)'
              g = groups[top]
              g[0] += i.file_size
              g[1] += i.compress_size
              g[2] += 1

          total_u = sum(i.file_size for i in infos)
          total_c = sum(i.compress_size for i in infos)
          print(f'TOTAL uncompressed={mib(total_u):.2f} MiB compressed_payload={mib(total_c):.2f} MiB files={len(infos)}')
          print('\nTOP-LEVEL GROUPS')
          for name, (u, c, count) in sorted(groups.items(), key=lambda kv: kv[1][1], reverse=True):
              print(f'{name:24} uncompressed={mib(u):9.2f} MiB  compressed={mib(c):9.2f} MiB  files={count}')

          print('\nLARGEST FILES BY COMPRESSED SIZE')
          for i in sorted(infos, key=lambda x: x.compress_size, reverse=True)[:50]:
              print(f'{mib(i.compress_size):8.2f} MiB compressed | {mib(i.file_size):8.2f} MiB raw | {i.filename}')

          print('\nDESKTOP_PET SUBGROUPS')
          pet = [i for i in infos if i.filename.replace('\\','/').startswith('desktop_pet/')]
          pet_groups = collections.defaultdict(lambda: [0,0,0])
          for i in pet:
              rel=i.filename.replace('\\','/')[len('desktop_pet/'):]
              first=rel.split('/',1)[0] if '/' in rel else '(root)'
              g=pet_groups[first]; g[0]+=i.file_size; g[1]+=i.compress_size; g[2]+=1
          for name,(u,c,count) in sorted(pet_groups.items(), key=lambda kv: kv[1][1], reverse=True):
              print(f'{name:24} uncompressed={mib(u):9.2f} MiB  compressed={mib(c):9.2f} MiB  files={count}')

          print('\nPADDLEOCR SUBGROUPS')
          po = [i for i in infos if i.filename.replace('\\','/').startswith('paddleocr/')]
          po_groups = collections.defaultdict(lambda: [0,0,0])
          for i in po:
              rel=i.filename.replace('\\','/')[len('paddleocr/'):]
              first=rel.split('/',1)[0] if '/' in rel else '(root)'
              g=po_groups[first]; g[0]+=i.file_size; g[1]+=i.compress_size; g[2]+=1
          for name,(u,c,count) in sorted(po_groups.items(), key=lambda kv: kv[1][1], reverse=True):
              print(f'{name:24} uncompressed={mib(u):9.2f} MiB  compressed={mib(c):9.2f} MiB  files={count}')

          # Same-size duplicate payloads are a useful first-pass signal for accidental duplication.
          by_key=collections.defaultdict(list)
          for i in infos:
              by_key[(i.CRC, i.file_size)].append(i.filename)
          dups=[(size,names) for (crc,size),names in by_key.items() if size>65536 and len(names)>1]
          print('\nPOTENTIAL DUPLICATES (same CRC + raw size, >64 KiB)')
          for size,names in sorted(dups, reverse=True)[:40]:
              print(f'{mib(size):8.2f} MiB each x{len(names)}: ' + ' | '.join(names))
          PY
