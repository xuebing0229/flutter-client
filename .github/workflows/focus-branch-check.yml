name: Focus Branch Check

on:
  push:
    branches:
      - work/focus-timer-127

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run focus regression tests
        run: >-
          flutter test
          test/features/focus_store_test.dart
          test/core/portability/full_workspace_roundtrip_test.dart
          test/core/sync/portable_sync_workspace_validator_test.dart
          test/core/adventurer_news_test.dart

  desktop-pet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Compile desktop pet host
        shell: pwsh
        run: dotnet build windows/desktop_pet/AdventurersGuild.DesktopPet.csproj -c Release
