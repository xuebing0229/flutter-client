name: Publish Internal 0.2.0 GitHub Backup

on:
  push:
    branches:
      - 'build/internal-0.2.0-from-beta-241'
    paths:
      - '.github/workflows/internal-github-release-0.2.0.yml'

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '41819934646'
  RELEASE_FILES_TOKEN: ${{ secrets.RELEASE_FILES_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download already-built packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p dist
          gh run download "$SOURCE_RUN_ID" --repo "${GITHUB_REPOSITORY}" -n internal-android-package -D dist
          gh run download "$SOURCE_RUN_ID" --repo "${GITHUB_REPOSITORY}" -n internal-windows-package -D dist
          test -s dist/app-internal.apk
          test -s dist/app-windows-internal.zip
          test -s dist/app-windows-internal-setup.exe

      - name: Publish durable backup release
        env:
          GH_TOKEN: ${{ env.RELEASE_FILES_TOKEN }}
        shell: bash
        run: |
          test -n "$GH_TOKEN"
          TAG="internal-v0.2.0+12"
          if gh release view "$TAG" --repo xuebing0229/release-files >/dev/null 2>&1; then
            gh release upload "$TAG"               dist/app-internal.apk#app-internal.apk               dist/app-windows-internal.zip#app-windows-internal.zip               dist/app-windows-internal-setup.exe#app-windows-internal-setup.exe               --repo xuebing0229/release-files --clobber
          else
            gh release create "$TAG"               dist/app-internal.apk#app-internal.apk               dist/app-windows-internal.zip#app-windows-internal.zip               dist/app-windows-internal-setup.exe#app-windows-internal-setup.exe               --repo xuebing0229/release-files               --title "Internal 0.2.0"               --notes "Internal 0.2.0."
          fi
