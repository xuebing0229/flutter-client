name: PWA validation

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/pwa-from-beta-182'

permissions:
  contents: read

concurrency:
  group: pwa-from-beta-182
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build PWA
        run: flutter build web --release --no-web-resources-cdn
      - name: Validate installable shell
        shell: bash
        run: |
          test -s build/web/index.html
          test -s build/web/manifest.json
          test -s build/web/pwa_service_worker.js
          test -s build/web/main.dart.js
          grep -q '"display": "standalone"' build/web/manifest.json
          grep -q "serviceWorker.register" build/web/index.html
          if grep -R "https://www.gstatic.com/flutter-canvaskit" build/web/flutter_bootstrap.js build/web/main.dart.js; then
            echo "Web build still references the CanvasKit CDN." >&2
            exit 1
          fi
      - name: Package PWA
        run: |
          cd build/web
          zip -qr ../../adventurers-guild-pwa-182.zip .
      - name: Upload PWA artifact
        uses: actions/upload-artifact@v4
        with:
          name: adventurers-guild-pwa-182
          path: adventurers-guild-pwa-182.zip
          retention-days: 14
          if-no-files-found: error
