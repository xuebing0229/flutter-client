name: Build Private License Issuer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/issuer-build-trigger'

permissions:
  contents: read

env:
  BETA_SIGNING_BUNDLE_BASE64: ${{ secrets.BETA_SIGNING_BUNDLE_BASE64 }}
  ACTIVATION_API_BASE_URL: https://license.apixb.top

jobs:
  build-issuer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java with Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Restore fixed signing bundle
        run: |
          test -n "$BETA_SIGNING_BUNDLE_BASE64"
          BUNDLE="$RUNNER_TEMP/beta-signing-bundle.zip"
          printf '%s' "$BETA_SIGNING_BUNDLE_BASE64" | base64 --decode > "$BUNDLE"
          unzip -q "$BUNDLE" -d android

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build signed issuer APK
        run: |
          flutter build apk \
            --release \
            --flavor issuer \
            --target lib/license_issuer/main.dart \
            --dart-define=ACTIVATION_API_BASE_URL="$ACTIVATION_API_BASE_URL"
          cp build/app/outputs/flutter-apk/app-issuer-release.apk app-license-issuer.apk

      - name: Upload issuer APK
        uses: actions/upload-artifact@v4
        with:
          name: app-license-issuer
          path: app-license-issuer.apk
          if-no-files-found: error
