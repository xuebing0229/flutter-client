name: Sol Audit Validation

on:
  push:
    branches:
      - 'audit/sol-recheck-20261011'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sol-audit-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    if: github.event_name != 'pull_request' || github.head_ref == 'audit/sol-recheck-20261011'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run full Flutter test suite
        run: flutter test
      - name: Validate server and shell tooling syntax
        run: |
          python3 -m py_compile server/activation_service/app.py tool/fetch_official_ppocrv6_models.py
          bash -n server/activation_service/install.sh
          bash -n server/activation_service/deploy.sh
          bash -n server/activation_service/backup.sh
          bash -n server/activation_service/smoke_test.sh
          bash -n tool/build_syncthing_android.sh

  android-beta-debug:
    if: github.event_name != 'pull_request' || github.head_ref == 'audit/sol-recheck-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Bundle PP-OCRv6 Small models
        run: python3 tool/fetch_official_ppocrv6_models.py
      - name: Compile Android Beta debug
        run: flutter build apk --debug --flavor beta --no-pub
