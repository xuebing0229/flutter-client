name: License Worker Staging Deploy

on:
  push:
    branches:
      - "deploy/license-worker-staging"
    paths:
      - "server/activation_worker/**"
      - ".github/workflows/license-worker-staging-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LICENSE_ADMIN_SETUP_KEY: ${{ secrets.LICENSE_ADMIN_SETUP_KEY }}
      DB_NAME: adventure-license-staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$LICENSE_ADMIN_SETUP_KEY" || { echo "Missing LICENSE_ADMIN_SETUP_KEY"; exit 1; }

      - name: Install Wrangler
        working-directory: server/activation_worker
        run: npm install

      - name: Find or create APAC staging D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          list_json="$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "$api")"
          db_id="$(printf '%s' "$list_json" | jq -r --arg name "$DB_NAME"             '.result[]? | select(.name == $name) | .uuid' | head -n1)"
          if [[ -z "$db_id" ]]; then
            created="$(curl --fail-with-body --silent --show-error               -X POST               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H "Content-Type: application/json"               --data '{"name":"adventure-license-staging","primary_location_hint":"apac"}'               "$api")"
            db_id="$(printf '%s' "$created" | jq -r '.result.uuid')"
          fi
          test -n "$db_id" && test "$db_id" != "null"
          echo "database_id=$db_id" >> "$GITHUB_OUTPUT"

      - name: Render staging Wrangler config
        working-directory: server/activation_worker
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          src = Path("wrangler.jsonc")
          data = json.loads(src.read_text(encoding="utf-8"))
          data["name"] = "adventure-license-staging"
          binding = data["d1_databases"][0]
          binding["database_name"] = "adventure-license-staging"
          binding["database_id"] = os.environ["D1_DATABASE_ID"]
          Path("wrangler.staging.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Initialize staging schema
        working-directory: server/activation_worker
        run: |
          npx wrangler d1 execute "$DB_NAME"             --remote             --config wrangler.staging.json             --file migrations/0001_schema.sql

      - name: Set staging administrator enrollment secret
        working-directory: server/activation_worker
        run: |
          printf '%s' "$LICENSE_ADMIN_SETUP_KEY" |             npx wrangler secret put LICENSE_ADMIN_SETUP_KEY               --config wrangler.staging.json

      - name: Deploy staging Worker
        working-directory: server/activation_worker
        run: npx wrangler deploy --config wrangler.staging.json
