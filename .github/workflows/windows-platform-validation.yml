name: Embedded Sync and Windows Validation

on:
  pull_request:
    paths:
      - 'lib/core/update/**'
      - 'lib/core/sync/**'
      - 'android/app/src/main/kotlin/com/workspace/client/k7m4/SyncthingBridge.kt'
      - 'android/app/src/main/kotlin/com/workspace/client/k7m4/SyncthingService.kt'
      - 'tool/build_syncthing_android.sh'
      - 'lib/core/desktop_pet/**'
      - 'lib/features/home/presentation/desktop_pet_page.dart'
      - 'lib/features/imports/data/windows_official_paddleocr.dart'
      - 'windows/**'
      - 'tool/test_windows_updater.ps1'
      - 'tool/fetch_syncthing_windows.ps1'
      - 'tool/bundle_windows_official_paddleocr.ps1'
      - '.github/workflows/windows-platform-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-platform-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'
          cache: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Bundle PP-OCRv6 Small models
        run: python3 tool/fetch_official_ppocrv6_models.py
      - name: Build pinned embedded Syncthing core
        env:
          SYNCTHING_VERSION: v2.1.7
        run: bash tool/build_syncthing_android.sh
      - name: Compile Android Beta debug
        run: flutter build apk --debug --flavor beta --no-pub

  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Enable Windows
        shell: pwsh
        run: flutter config --enable-windows-desktop
      - name: Install dependencies
        shell: pwsh
        run: flutter pub get
      - name: Test Windows updater and installer process shutdown
        shell: powershell
        run: ./tool/test_windows_updater.ps1
      - name: Compile Windows debug
        shell: pwsh
        run: flutter build windows --debug
      - name: Compile desktop pet host
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'validation-desktop-pet'
          dotnet publish 'windows/desktop_pet/AdventurersGuild.DesktopPet.csproj' `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o $output
          if (-not (Test-Path (Join-Path $output 'AdventurersGuild.DesktopPet.exe'))) {
            throw 'Desktop pet host was not created.'
          }
