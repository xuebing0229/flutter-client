name: Screenshot Import Validation
on:
  push:
    branches:
      - feat/screenshot-order-import-20261008
  workflow_dispatch:

concurrency:
  group: screenshot-import-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install
        run: flutter pub get
      - name: Test import domain
        run: flutter test test/features/screenshot_import_rules_test.dart test/features/screenshot_layout_parser_test.dart test/features/import_batch_preset_state_test.dart test/features/screenshot_duplicate_review_test.dart test/features/screenshot_product_dedup_test.dart test/features/screenshot_import_draft_test.dart test/features/screenshot_product_layout_parser_test.dart
      - name: Static analysis
        run: flutter analyze lib/features/imports lib/features/home/presentation/home_page.dart

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Compile Android Beta debug OCR (no release)
        run: flutter build apk --debug --flavor beta --no-pub

  windows-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Enable Windows
        shell: pwsh
        run: flutter config --enable-windows-desktop
      - name: Install
        shell: pwsh
        run: flutter pub get
      - name: Compile Windows
        shell: pwsh
        run: flutter build windows --debug
      - name: Bundle and check offline OCR
        shell: pwsh
        run: ./tool/bundle_windows_ocr.ps1 -OutputDir "build/windows/x64/runner/Debug"
