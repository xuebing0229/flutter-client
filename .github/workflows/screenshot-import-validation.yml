name: Screenshot Import Validation
on:
  push:
    branches:
      - feat/screenshot-order-import-20261008
      - 'feat/ppocrv6-small-session-scope-20261009'
      - 'fix/ocr-native-crash-diagnostics-20261009'
      - 'fix/ppocrv6-official-baseline-20261009'
      - 'fix/ocr-clean-symbol-fragments-20261009'
  workflow_dispatch:

concurrency:
  group: screenshot-import-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install
        run: flutter pub get
      - name: Test import domain
        run: flutter test test/features/screenshot_import_rules_test.dart test/features/screenshot_layout_parser_test.dart test/features/import_batch_preset_state_test.dart test/features/screenshot_duplicate_review_test.dart test/features/screenshot_product_dedup_test.dart test/features/screenshot_import_draft_test.dart test/features/screenshot_product_layout_parser_test.dart test/features/windows_official_paddleocr_test.dart test/features/screenshot_real_layout_regression_test.dart test/features/screenshot_ocr_real_world_regression_test.dart
      - name: Static analysis
        run: flutter analyze lib/features/imports lib/features/home/presentation/home_page.dart

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Bundle PP-OCRv6 Small models
        run: python3 tool/fetch_official_ppocrv6_models.py
      - name: Compile Android Beta debug OCR (no release)
        run: flutter build apk --debug --flavor beta --no-pub

  windows-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Enable Windows
        shell: pwsh
        run: flutter config --enable-windows-desktop
      - name: Install
        shell: pwsh
        run: flutter pub get
      - name: Compile Windows
        shell: pwsh
        run: flutter build windows --debug
      - name: Cache official PaddleOCR Windows runtime
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ag-official-paddleocr
          key: official-paddleocr-windows-dab3fe35379033fdcb2d0e9572fac0b36c9a9ebf-paddle3.2.1-opencv4.12.0-v1

      - name: Bundle and check official offline OCR
        shell: pwsh
        run: ./tool/bundle_windows_official_paddleocr.ps1 -OutputDir "build/windows/x64/runner/Debug"
