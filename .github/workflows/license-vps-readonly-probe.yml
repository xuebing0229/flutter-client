name: License VPS Readonly Probe

on:
  push:
    branches:
      - "deploy/license-worker-staging"
    paths:
      - ".github/workflows/license-vps-readonly-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: 149.88.84.90
      VPS_PORT: "22"
      VPS_USER: adventure-release
      SSH_KEY: ${{ secrets.INTERNAL_RELEASE_SSH_KEY }}

    steps:
      - name: Check saved deployment key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo "INTERNAL_RELEASE_SSH_KEY is not available"; exit 2; }

      - name: Probe license VPS read access
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/license_vps"
          chmod 600 "$HOME/.ssh/license_vps"
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh             -p "$VPS_PORT"             -i "$HOME/.ssh/license_vps"             -o BatchMode=yes             -o ConnectTimeout=10             -o UserKnownHostsFile="$HOME/.ssh/known_hosts"             "$VPS_USER@$VPS_HOST"             'set -eu
             echo "ssh_user=$(id -un)"
             if test -r /var/lib/adventure-license/license.db; then echo "license_db_readable=yes"; else echo "license_db_readable=no"; fi
             if test -r /etc/adventure-license/service.env; then echo "service_env_readable=yes"; else echo "service_env_readable=no"; fi
             if sudo -n true >/dev/null 2>&1; then echo "passwordless_sudo=yes"; else echo "passwordless_sudo=no"; fi
             if test -r /srv/adventure-releases; then echo "release_dir_readable=yes"; else echo "release_dir_readable=no"; fi'
