# Internal 0.1.4 build/publish pipeline.
name: Build and Publish Internal

on:
  workflow_dispatch:
  push:
    branches:
      - 'build/internal-*'
    paths:
      - pubspec.yaml
      - .github/workflows/internal-build.yml

permissions:
  contents: read

concurrency:
  group: internal-build
  cancel-in-progress: false

env:
  RELEASE_SIGNING_BUNDLE_BASE64: ${{ secrets.RELEASE_SIGNING_BUNDLE_BASE64 }}
  ACTIVATION_API_BASE_URL: https://license.apixb.top
  INTERNAL_SOURCE_BUILD: '158'
  INTERNAL_RELEASE_BUILD: '5'
  RELEASE_SITE_BASE_URL: https://license.apixb.top/releases
  RELEASE_DEPLOY_HOST: license.apixb.top
  RELEASE_DEPLOY_USER: adventure-release
  RELEASE_DEPLOY_PATH: /srv/adventure-releases
  RELEASE_SSH_KEY: ${{ secrets.INTERNAL_RELEASE_SSH_KEY }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run full Flutter test suite
        run: flutter test

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java with Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Set up Go for embedded Syncthing
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'
          cache: true

      - name: Cache embedded Syncthing binaries
        uses: actions/cache@v4
        with:
          path: android/app/src/sync/jniLibs
          key: embedded-syncthing-v2.1.5-2ca95cf149810411-${{ runner.os }}-android

      - name: Build embedded Syncthing core
        env:
          SYNCTHING_VERSION: v2.1.5
        run: bash tool/build_syncthing_android.sh

      - name: Restore fixed Internal signing bundle
        run: |
          test -n "$RELEASE_SIGNING_BUNDLE_BASE64"
          BUNDLE="$RUNNER_TEMP/internal-signing-bundle.zip"
          printf '%s' "$RELEASE_SIGNING_BUNDLE_BASE64" | base64 --decode > "$BUNDLE"
          unzip -q "$BUNDLE" -d android

      - name: Install dependencies
        run: flutter pub get

      - name: Bundle verified PP-OCRv6 Small models
        run: python3 tool/fetch_official_ppocrv6_models.py

      - name: Build signed Internal APK
        run: |
          flutter build apk \
            --release \
            --flavor internal \
            --build-number="$INTERNAL_RELEASE_BUILD" \
            --dart-define=APP_CHANNEL=internal \
            --dart-define=INTERNAL_SOURCE_BUILD="$INTERNAL_SOURCE_BUILD" \
            --dart-define=INTERNAL_RELEASE_BUILD="$INTERNAL_RELEASE_BUILD" \
            --dart-define=ACTIVATION_API_BASE_URL="$ACTIVATION_API_BASE_URL"
          cp build/app/outputs/flutter-apk/app-internal-release.apk app-internal.apk

      - name: Verify Internal APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app-internal.apk

      - name: Upload Android Internal package
        uses: actions/upload-artifact@v4
        with:
          name: internal-android-package
          path: app-internal.apk
          retention-days: 30
          if-no-files-found: error

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Test Windows updater and installer process shutdown
        shell: powershell
        run: ./tool/test_windows_updater.ps1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Internal
        shell: pwsh
        run: |
          flutter build windows --release --build-number="$env:INTERNAL_RELEASE_BUILD" `
            --dart-define=APP_CHANNEL=internal `
            --dart-define="INTERNAL_SOURCE_BUILD=$env:INTERNAL_SOURCE_BUILD" `
            --dart-define="INTERNAL_RELEASE_BUILD=$env:INTERNAL_RELEASE_BUILD" `
            --dart-define="ACTIVATION_API_BASE_URL=$env:ACTIVATION_API_BASE_URL"

      - name: Build VPet desktop companion
        shell: pwsh
        run: |
          $output = "build/windows/x64/runner/Release/desktop_pet"
          dotnet publish "windows/desktop_pet/AdventurersGuild.DesktopPet.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o $output
          if (-not (Test-Path (Join-Path $output "AdventurersGuild.DesktopPet.exe"))) {
            throw "Desktop pet host was not created."
          }

      - name: Bundle embedded Syncthing core
        shell: pwsh
        run: ./tool/fetch_syncthing_windows.ps1 -Version v2.1.5

      - name: Cache official PaddleOCR Windows runtime
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ag-official-paddleocr
          key: official-paddleocr-windows-dab3fe35379033fdcb2d0e9572fac0b36c9a9ebf-paddle3.2.1-opencv4.12.0-v1

      - name: Bundle official PaddleOCR C++ screenshot recognition
        shell: pwsh
        run: ./tool/bundle_windows_official_paddleocr.ps1

      - name: Bundle current Windows icon
        shell: pwsh
        run: |
          $versionLine = Get-Content pubspec.yaml |
            Where-Object { $_ -match '^version:' } |
            Select-Object -First 1
          if (-not $versionLine) {
            throw "pubspec.yaml version was not found."
          }
          $version = (($versionLine -split ':', 2)[1].Trim() -split '\+', 2)[0]
          $releaseDir = "build/windows/x64/runner/Release"
          $sourceIcon = "windows/runner/resources/app_icon.ico"
          Copy-Item -LiteralPath $sourceIcon -Destination (Join-Path $releaseDir "app_icon.ico") -Force
          Copy-Item -LiteralPath $sourceIcon -Destination (Join-Path $releaseDir "app_icon_$version.ico") -Force
          Copy-Item -LiteralPath "windows/installer/refresh_app_shortcuts.ps1" -Destination $releaseDir -Force

      - name: Package Windows Internal
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "app-windows-internal.zip" `
            -Force

      - name: Build Windows Internal installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found."
          }

          $versionLine = Get-Content pubspec.yaml |
            Where-Object { $_ -match '^version:' } |
            Select-Object -First 1
          if (-not $versionLine) {
            throw "pubspec.yaml version was not found."
          }
          $version = (($versionLine -split ':', 2)[1].Trim() -split '\+', 2)[0]

          & $iscc `
            "/DMyAppVersion=$version" `
            "/O$PWD" `
            "/Fapp-windows-internal-setup" `
            "windows\installer\adventurers_guild_internal.iss"

          if (-not (Test-Path "app-windows-internal-setup.exe")) {
            throw "Windows Internal installer was not created."
          }

      - name: Upload Windows Internal package
        uses: actions/upload-artifact@v4
        with:
          name: internal-windows-package
          path: |
            app-windows-internal.zip
            app-windows-internal-setup.exe
          retention-days: 30
          if-no-files-found: error

  publish:
    needs:
      - android
      - windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check whether release-site SSH is configured
        id: deploy
        shell: bash
        run: |
          if [[ -n "$RELEASE_SSH_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::INTERNAL_RELEASE_SSH_KEY is not configured; build artifacts are ready, website publish is skipped."
          fi

      - name: Download Android package
        if: steps.deploy.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: internal-android-package
          path: dist

      - name: Download Windows package
        if: steps.deploy.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: internal-windows-package
          path: dist

      - name: Build release-site payload
        if: steps.deploy.outputs.enabled == 'true'
        shell: bash
        run: |
          VERSION=$(python3 - <<'PY'
          from pathlib import Path
          for line in Path("pubspec.yaml").read_text().splitlines():
              if line.startswith("version:"):
                  print(line.split(":", 1)[1].strip().split("+", 1)[0])
                  break
          PY
          )
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          mkdir -p "site/internal/$VERSION"
          cp dist/app-internal.apk "site/internal/$VERSION/app-internal.apk"
          cp dist/app-windows-internal.zip "site/internal/$VERSION/app-windows-internal.zip"
          cp dist/app-windows-internal-setup.exe "site/internal/$VERSION/app-windows-internal-setup.exe"
          cp server/release_site/index.html site/index.html

          python3 - "$VERSION" "$INTERNAL_RELEASE_BUILD" "$INTERNAL_SOURCE_BUILD" "$RELEASE_SITE_BASE_URL" <<'PY'
          import hashlib
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          version, build, source_build, base_url = sys.argv[1:]
          build = int(build)
          source_build = int(source_build)
          root = Path("site")
          release_dir = root / "internal" / version
          android = release_dir / "app-internal.apk"
          windows_zip = release_dir / "app-windows-internal.zip"
          windows_setup = release_dir / "app-windows-internal-setup.exe"

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          published_at = datetime.now(timezone.utc).isoformat()
          release_base = f"{base_url}/internal/{version}"
          notes = (
              "Windows 卸载流程与新设备加入继续修复；"
              "内测版新增应用内检查更新、断点续传、暂停继续和自动安装，"
              "更新文件改由公会自己的香港服务器提供。"
          )

          android_data = {
              "schema": 1,
              "channel": "internal",
              "version": version,
              "build": build,
              "published": True,
              "download_url": f"{release_base}/app-internal.apk",
              "size_bytes": android.stat().st_size,
              "sha256": sha256(android),
              "notes": notes,
          }
          windows_data = {
              "schema": 1,
              "channel": "internal",
              "version": version,
              "build": build,
              "published": True,
              "download_url": f"{release_base}/app-windows-internal.zip",
              "size_bytes": windows_zip.stat().st_size,
              "sha256": sha256(windows_zip),
              "notes": notes,
          }
          latest = {
              "schema": 1,
              "channel": "internal",
              "version": version,
              "build": build,
              "source_test_build": source_build,
              "published": True,
              "published_at": published_at,
              "notes": notes,
              "android": {
                  "download_url": android_data["download_url"],
                  "size_bytes": android_data["size_bytes"],
                  "sha256": android_data["sha256"],
              },
              "windows": {
                  "download_url": windows_data["download_url"],
                  "size_bytes": windows_data["size_bytes"],
                  "sha256": windows_data["sha256"],
                  "installer_url": f"{release_base}/app-windows-internal-setup.exe",
                  "installer_size_bytes": windows_setup.stat().st_size,
                  "installer_sha256": sha256(windows_setup),
              },
          }

          (root / "internal" / "android-latest.json").write_text(
              json.dumps(android_data, ensure_ascii=False, indent=2) + "\n"
          )
          (root / "internal" / "windows-latest.json").write_text(
              json.dumps(windows_data, ensure_ascii=False, indent=2) + "\n"
          )
          (root / "internal" / "latest.json").write_text(
              json.dumps(latest, ensure_ascii=False, indent=2) + "\n"
          )
          (release_dir / "release.json").write_text(
              json.dumps(latest, ensure_ascii=False, indent=2) + "\n"
          )
          PY

      - name: Configure release-site SSH
        if: steps.deploy.outputs.enabled == 'true'
        shell: bash
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$RELEASE_SSH_KEY" > "$HOME/.ssh/internal-release"
          chmod 0600 "$HOME/.ssh/internal-release"
          ssh-keyscan -H "$RELEASE_DEPLOY_HOST" > "$HOME/.ssh/known_hosts"

      - name: Upload versioned files first
        if: steps.deploy.outputs.enabled == 'true'
        shell: bash
        run: |
          SSH="ssh -i $HOME/.ssh/internal-release -o BatchMode=yes"
          $SSH "$RELEASE_DEPLOY_USER@$RELEASE_DEPLOY_HOST" \
            "mkdir -p '$RELEASE_DEPLOY_PATH/internal/$VERSION'"
          rsync -av --chmod=F644,D755 \
            -e "$SSH" \
            "site/internal/$VERSION/" \
            "$RELEASE_DEPLOY_USER@$RELEASE_DEPLOY_HOST:$RELEASE_DEPLOY_PATH/internal/$VERSION/"
          rsync -av --chmod=F644 \
            -e "$SSH" \
            site/index.html \
            "$RELEASE_DEPLOY_USER@$RELEASE_DEPLOY_HOST:$RELEASE_DEPLOY_PATH/index.html"

      - name: Publish latest manifests last
        if: steps.deploy.outputs.enabled == 'true'
        shell: bash
        run: |
          SSH="ssh -i $HOME/.ssh/internal-release -o BatchMode=yes"
          rsync -av --chmod=F644 \
            -e "$SSH" \
            site/internal/android-latest.json \
            site/internal/windows-latest.json \
            site/internal/latest.json \
            "$RELEASE_DEPLOY_USER@$RELEASE_DEPLOY_HOST:$RELEASE_DEPLOY_PATH/internal/"

      - name: Verify published release site
        if: steps.deploy.outputs.enabled == 'true'
        shell: bash
        run: |
          curl --fail --show-error --silent --retry 5 --retry-delay 2 \
            "$RELEASE_SITE_BASE_URL/internal/latest.json" >/dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 2 \
            "$RELEASE_SITE_BASE_URL/internal/android-latest.json" >/dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 2 \
            "$RELEASE_SITE_BASE_URL/internal/windows-latest.json" >/dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 2 \
            "$RELEASE_SITE_BASE_URL/" >/dev/null
