name: Build and Publish Beta

on:
  workflow_dispatch:
  push:
    branches:
      - 'build/beta-*'
    paths:
      - pubspec.yaml

permissions:
  contents: read

concurrency:
  group: beta-publish
  cancel-in-progress: true

env:
  RELEASE_FILES_TOKEN: ${{ secrets.RELEASE_FILES_TOKEN }}
  BETA_SIGNING_BUNDLE_BASE64: ${{ secrets.BETA_SIGNING_BUNDLE_BASE64 }}
  ACTIVATION_API_BASE_URL: https://license.apixb.top

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify Beta source lineage
        shell: bash
        run: |
          REQUIRED_BASE="9e8ed11502825e1cc9d4d157f6d477ccbb68f6b0"
          if ! git merge-base --is-ancestor "$REQUIRED_BASE" HEAD; then
            echo "::error::This Beta branch does not descend from the verified Beta 166 lineage. Refusing to publish a regression build."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run full Flutter test suite
        run: flutter test

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java with Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Set up Go for embedded Syncthing
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'
          cache: true

      - name: Cache embedded Syncthing binaries
        uses: actions/cache@v4
        with:
          path: android/app/src/sync/jniLibs
          key: embedded-syncthing-v2.1.5-2ca95cf149810411-${{ runner.os }}-android

      - name: Build embedded Syncthing core
        env:
          SYNCTHING_VERSION: v2.1.5
        run: bash tool/build_syncthing_android.sh

      - name: Restore fixed Beta signing bundle
        run: |
          test -n "$BETA_SIGNING_BUNDLE_BASE64"
          BUNDLE="$RUNNER_TEMP/beta-signing-bundle.zip"
          printf '%s' "$BETA_SIGNING_BUNDLE_BASE64" | base64 --decode > "$BUNDLE"
          unzip -q "$BUNDLE" -d android

      - name: Install dependencies
        run: flutter pub get

      - name: Bundle verified PP-OCRv6 Small models
        run: python3 tool/fetch_official_ppocrv6_models.py

      - name: Build signed Beta APK
        run: |
          flutter build apk \
            --release \
            --flavor beta \
            --dart-define=APP_CHANNEL=beta \
            --dart-define=ACTIVATION_API_BASE_URL="$ACTIVATION_API_BASE_URL"
          cp build/app/outputs/flutter-apk/app-beta-release.apk app-beta.apk

      - name: Verify Beta APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app-beta.apk

      - name: Upload Android Beta package
        uses: actions/upload-artifact@v4
        with:
          name: beta-android-package
          path: app-beta.apk
          retention-days: 1
          if-no-files-found: error

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Test Windows updater and installer process shutdown
        shell: powershell
        run: ./tool/test_windows_updater.ps1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Beta
        shell: pwsh
        run: flutter build windows --release --dart-define=APP_CHANNEL=beta --dart-define="ACTIVATION_API_BASE_URL=$env:ACTIVATION_API_BASE_URL"

      - name: Build VPet desktop companion
        shell: pwsh
        run: |
          $output = "build/windows/x64/runner/Release/desktop_pet"
          dotnet publish "windows/desktop_pet/AdventurersGuild.DesktopPet.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o $output
          if (-not (Test-Path (Join-Path $output "AdventurersGuild.DesktopPet.exe"))) {
            throw "Desktop pet host was not created."
          }

      - name: Bundle embedded Syncthing core
        shell: pwsh
        run: ./tool/fetch_syncthing_windows.ps1 -Version v2.1.5

      - name: Cache official PaddleOCR Windows runtime
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ag-official-paddleocr
          key: official-paddleocr-windows-dab3fe35379033fdcb2d0e9572fac0b36c9a9ebf-paddle3.2.1-opencv4.12.0-v1

      - name: Bundle official PaddleOCR C++ screenshot recognition
        shell: pwsh
        run: ./tool/bundle_windows_official_paddleocr.ps1

      - name: Bundle current Windows icon
        shell: pwsh
        run: |
          $versionLine = Get-Content pubspec.yaml |
            Where-Object { $_ -match '^version:' } |
            Select-Object -First 1
          if (-not $versionLine) {
            throw "pubspec.yaml version was not found."
          }
          $version = ($versionLine -split ':', 2)[1].Trim()
          $releaseDir = "build/windows/x64/runner/Release"
          $sourceIcon = "windows/runner/resources/app_icon.ico"
          Copy-Item -LiteralPath $sourceIcon -Destination (Join-Path $releaseDir "app_icon.ico") -Force
          Copy-Item -LiteralPath $sourceIcon -Destination (Join-Path $releaseDir "app_icon_$version.ico") -Force
          Copy-Item -LiteralPath "windows/installer/refresh_app_shortcuts.ps1" -Destination $releaseDir -Force

      - name: Package Windows Beta
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "app-windows-beta.zip" `
            -Force

      - name: Build Windows Beta installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found."
          }

          $versionLine = Get-Content pubspec.yaml |
            Where-Object { $_ -match '^version:' } |
            Select-Object -First 1
          if (-not $versionLine) {
            throw "pubspec.yaml version was not found."
          }
          $version = ($versionLine -split ':', 2)[1].Trim()

          & $iscc `
            "/DMyAppVersion=$version" `
            "/O$PWD" `
            "/Fapp-windows-beta-setup" `
            "windows\installer\adventurers_guild_beta.iss"

          if (-not (Test-Path "app-windows-beta-setup.exe")) {
            throw "Windows Beta installer was not created."
          }

      - name: Upload Windows Beta package
        uses: actions/upload-artifact@v4
        with:
          name: beta-windows-package
          path: |
            app-windows-beta.zip
            app-windows-beta-setup.exe
          retention-days: 1
          if-no-files-found: error

  web:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build PWA Beta
        run: |
          flutter build web \
            --release \
            --no-web-resources-cdn \
            --dart-define=APP_CHANNEL=beta \
            --dart-define=ACTIVATION_API_BASE_URL="$ACTIVATION_API_BASE_URL"

      - name: Finalize offline PWA cache
        run: python3 tool/finalize_pwa.py build/web

      - name: Validate installable PWA shell
        shell: bash
        run: |
          test -s build/web/index.html
          test -s build/web/manifest.json
          test -s build/web/pwa_service_worker.js
          test -s build/web/main.dart.js
          test -s build/web/canvaskit/canvaskit.js
          test -s build/web/canvaskit/canvaskit.wasm
          grep -q '"display": "standalone"' build/web/manifest.json
          grep -q "serviceWorker.register" build/web/index.html
          grep -q './main.dart.js' build/web/pwa_service_worker.js
          grep -q './canvaskit/canvaskit.wasm' build/web/pwa_service_worker.js
          if grep -q '__PWA_PRECACHE_FILES__' build/web/pwa_service_worker.js; then
            echo "PWA precache manifest was not finalized." >&2
            exit 1
          fi

      - name: Package PWA Beta
        run: |
          cd build/web
          zip -qr ../../app-pwa-beta.zip .

      - name: Upload PWA Beta package
        uses: actions/upload-artifact@v4
        with:
          name: beta-pwa-package
          path: app-pwa-beta.zip
          retention-days: 1
          if-no-files-found: error

  publish:
    needs:
      - android
      - windows
      - web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download Android Beta package
        uses: actions/download-artifact@v4
        with:
          name: beta-android-package
          path: dist

      - name: Download Windows Beta package
        uses: actions/download-artifact@v4
        with:
          name: beta-windows-package
          path: dist

      - name: Download PWA Beta package
        uses: actions/download-artifact@v4
        with:
          name: beta-pwa-package
          path: dist

      - name: Read build metadata
        shell: bash
        run: |
          META=$(python3 - <<'PY'
          from pathlib import Path
          for line in Path("pubspec.yaml").read_text().splitlines():
              if line.startswith("version:"):
                  value = line.split(":", 1)[1].strip()
                  version, build = value.split("+", 1)
                  print(version)
                  print(build)
                  break
          PY
          )
          VERSION=$(printf '%s\n' "$META" | sed -n '1p')
          BUILD=$(printf '%s\n' "$META" | sed -n '2p')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"

      - name: Require a newer Beta build number
        shell: bash
        env:
          GH_TOKEN: ${{ env.RELEASE_FILES_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          CURRENT_JSON="$RUNNER_TEMP/current-beta-version.json"
          gh api repos/xuebing0229/release-files/contents/version.json \
            --jq .content | base64 --decode > "$CURRENT_JSON"
          python3 - "$CURRENT_JSON" "$BUILD" <<'PY'
          import json
          import sys
          from pathlib import Path

          current = json.loads(Path(sys.argv[1]).read_text())
          previous = current.get("build")
          candidate = int(sys.argv[2])
          if isinstance(previous, int) and candidate <= previous:
              raise SystemExit(
                  f"Beta build number must increase: current={previous}, candidate={candidate}. "
                  "Increment pubspec.yaml before publishing."
              )
          PY

      - name: Prepare static Beta update manifest
        shell: bash
        run: |
          python3 - <<PY
          import hashlib
          import json
          from pathlib import Path
          from urllib.parse import quote

          tag = "beta-v${VERSION}+${BUILD}-run${GITHUB_RUN_NUMBER}"
          release_base = (
              "https://github.com/xuebing0229/release-files/releases/download/"
              + quote(tag, safe="")
          )
          android_path = Path("dist/app-beta.apk")
          windows_path = Path("dist/app-windows-beta.zip")
          pwa_path = Path("dist/app-pwa-beta.zip")

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          data = {
              "schema": 1,
              "channel": "beta",
              "version": "${VERSION}",
              "build": int("${BUILD}"),
              "published": True,
              "download_url": release_base + "/app-beta.apk",
              "android_size_bytes": android_path.stat().st_size,
              "android_sha256": sha256(android_path),
              "windows_download_url": release_base + "/app-windows-beta.zip",
              "windows_size_bytes": windows_path.stat().st_size,
              "windows_sha256": sha256(windows_path),
              "windows_installer_url": release_base + "/app-windows-beta-setup.exe",
              "pwa_download_url": release_base + "/app-pwa-beta.zip",
              "pwa_size_bytes": pwa_path.stat().st_size,
              "pwa_sha256": sha256(pwa_path),
              "notes": "Beta ${VERSION} (${BUILD})",
          }
          Path("app-beta-latest.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n"
          )
          PY

      - name: Publish Android and Windows packages
        env:
          GH_TOKEN: ${{ env.RELEASE_FILES_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          TAG="beta-v${VERSION}+${BUILD}-run${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            "dist/app-beta.apk#app-beta.apk" \
            "dist/app-windows-beta.zip#app-windows-beta.zip" \
            "dist/app-windows-beta-setup.exe#app-windows-beta-setup.exe" \
            "dist/app-pwa-beta.zip#app-pwa-beta.zip" \
            "app-beta-latest.json#app-beta-latest.json" \
            --repo xuebing0229/release-files \
            --title "Beta ${VERSION} (${BUILD})" \
            --notes "Automated Beta build ${VERSION} (${BUILD}) for Android and Windows." \
            --latest

      - name: Update public Beta manifest
        env:
          GH_TOKEN: ${{ env.RELEASE_FILES_TOKEN }}
        run: |
          gh auth setup-git
          rm -rf "$RUNNER_TEMP/release-files"
          gh repo clone xuebing0229/release-files "$RUNNER_TEMP/release-files"
          cd "$RUNNER_TEMP/release-files"

          python3 - <<PY
          import hashlib
          import json
          from pathlib import Path
          from urllib.parse import quote

          tag = "beta-v${VERSION}+${BUILD}-run${GITHUB_RUN_NUMBER}"
          release_base = (
              "https://github.com/xuebing0229/release-files/releases/download/"
              + quote(tag, safe="")
          )
          android_path = Path("${GITHUB_WORKSPACE}/dist/app-beta.apk")
          windows_path = Path("${GITHUB_WORKSPACE}/dist/app-windows-beta.zip")
          pwa_path = Path("${GITHUB_WORKSPACE}/dist/app-pwa-beta.zip")

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          path = Path("version.json")
          data = json.loads(path.read_text())
          data.update({
              "schema": 1,
              "channel": "beta",
              "version": "${VERSION}",
              "build": int("${BUILD}"),
              "published": True,
              "download_url": release_base + "/app-beta.apk",
              "android_size_bytes": android_path.stat().st_size,
              "android_sha256": sha256(android_path),
              "windows_download_url": release_base + "/app-windows-beta.zip",
              "windows_size_bytes": windows_path.stat().st_size,
              "windows_sha256": sha256(windows_path),
              "windows_installer_url": release_base + "/app-windows-beta-setup.exe",
              "pwa_download_url": release_base + "/app-pwa-beta.zip",
              "pwa_size_bytes": pwa_path.stat().st_size,
              "pwa_sha256": sha256(pwa_path),
              "notes": "Beta ${VERSION} (${BUILD})",
          })
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "beta: publish ${VERSION} (${BUILD})"
          git push

