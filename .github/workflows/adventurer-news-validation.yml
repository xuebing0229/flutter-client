name: Adventurer News Validation

on:
  pull_request:
    paths:
      - 'lib/core/changelog/adventurer_news.dart'
      - 'lib/features/home/presentation/adventurer_news_dialog.dart'
      - 'test/core/adventurer_news_test.dart'
      - 'test/features/home/adventurer_news_dialog_test.dart'
      - '.github/workflows/adventurer-news-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adventurer-news-validation
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Verify cumulative news and version ranges
        run: flutter test test/core/adventurer_news_test.dart test/features/home/adventurer_news_dialog_test.dart
      - name: Analyze Adventurer News sources
        run: flutter analyze lib/core/changelog/adventurer_news.dart lib/features/home/presentation/adventurer_news_dialog.dart
