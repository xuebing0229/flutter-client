name: Adventurer News Validation

on:
  push:
    branches:
      - feat/adventurer-news-20261008
      - fix/adventurer-news-inline-20261008
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adventurer-news-validation
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Verify cumulative news and version ranges
        run: flutter test test/core/adventurer_news_test.dart test/features/home/adventurer_news_dialog_test.dart test/features/screenshot_ocr_real_world_regression_test.dart test/features/screenshot_layout_parser_test.dart test/features/screenshot_real_layout_regression_test.dart
      - name: Analyze application
        run: flutter analyze
