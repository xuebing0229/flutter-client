name: Web iOS validation

on:
  workflow_dispatch:
  push:
    branches:
      - 'web-ios'

permissions:
  contents: read

concurrency:
  group: web-ios-validation
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build web release
        run: flutter build web --release
      - name: Pack single-file offline HTML
        run: |
          mkdir -p dist
          python3 tool/pack_web_single_html.py \
            build/web \
            "dist/冒险者公会.html"

      - name: Validate portable HTML
        shell: bash
        run: |
          test -s "dist/冒险者公会.html"
          SIZE=$(wc -c < "dist/冒险者公会.html")
          test "$SIZE" -gt 5000000
          if grep -Eiq '<script[^>]+src=' "dist/冒险者公会.html"; then
            echo "Portable HTML still contains an external script tag." >&2
            exit 1
          fi
          echo "Portable HTML size: $SIZE bytes"

      - name: Upload single HTML
        uses: actions/upload-artifact@v4
        with:
          name: adventurers-guild-html
          path: "dist/冒险者公会.html"
          retention-days: 7
          if-no-files-found: error
